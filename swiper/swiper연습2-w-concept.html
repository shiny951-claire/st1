<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>swiper연습2-wconcept</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- swiperjs css -->
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
<!-- swiperjs  스크립트 설치 -->
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<style>
  /* 
    1. .swiper-slide 수평으로 나란하게
      문제
       1. 1슬라이드 나머지 보이지 않음
       2. .swiper-slide
    2. 1번슬라이드가 브라우저 왼쪽:0이 아니라 기존스킨의 너비에 맞춰서 시작했으면.
      문제
       1.swiper 브라우저 다 사용
       2.슬라이드 진행 기존스킨의 너비만큼만
    3. swiper view 3개 slide가 표시되게 하고(3단)
    4. swiper-slide 후손인 img 가 swiper-slide의 너비를 따르지 않음
      문제
       1.swiper-slide>a        swiper-slide>a>img  가 inline
    5.swiper-slide 사이에 여백
      문제
       1.swiper에서는 아이템간 여백을 margin-right로 지정
    6.수평스크롤바 없애야함
    7.페이지네이션의 type:'progressbar'변경
    8. 프로그레스바의 위치를 swiper아래로 이동
      문제
      1. 동일요소에 top 설정되어있어서 자리를 bottom
      2. bottom -값을 주면 .swiper-wrap 영역 밖으로 나갈경우 사라지는 문제
         .visual-section이 overflow:hidden을 유지하면서 progressbar를 표시
      3. next, prev, play 버튼만큼 progressbar의 크기 줄여야함
    9. next, prev 단추를 progressbar 오른쪽에 위치시킴
      문제
      1.swiper-button-prev, swiper-button-next 버튼이 .swiper-wrapper자식으로 되어있어서 개별이동을 해야함
      2. swiper-button-prev, swiper-button-next 버튼 position:absolute 없애고 자리매치
  */


  /* 슬라이드 위치 확인 */
  /* .visual-section .swiper-slide{
    position: relative; 
  }
  .visual-section .swiper-slide span{
    position: absolute;
    left: 0; top: 0;
    background-color: #fff;
  } */
/* ↑슬라이드 위치 확인후 제거할 것 */

.visual-section{
  --swiper-control-position-bottom:-40px
  /* 문제2-1해결 브라우저의 너비 전부사용, 기존css가 어떻게 되어있는지 몰라도! */
  width: 100% !important;
  max-width: 100% !important;
  /* 문제6  해결-71번줄 overflow: visible;과 함께 */
  overflow: hidden;
  /* 문제8-2  자식높이(swiper)+80px */
  padding-bottom: 80px;
}

  .visual-section .swiper {
    /* 문제1-1 해결 */
    overflow: visible;
    /* 문제2-2 해결 */
    max-width: 1420px;
    width: 92%;
  }

.visual-section .swiper-wrapper{
  /* 5 swiper작동을 위해서는 gap을 지정하지 말고 script에 spaceBetween속성을 지정*/
  /* gap: 20px; */
}
.visual-section .swiper-slide{
  /* 문제1-2 해결 */
  /* width: auto; */
  /* 3 */
  /* 3. swiper를 사용하면 script에서 slidePerView를 사용. width를 지정해도 무시됨 */
  /* width: 33.33%; */

/*  */
}
.visual-section .swiper-slide >a{
  /* 4 */
  display: block;
}
.visual-section .swiper-slide >a>img{
  /* 4 */
  display: block;
  width: 100%;
  }

/* progressbar */
.visual-section .swiper-pagination-progressbar{
  /* height: var(--swiper-pagination-progressbar-size, 4px); */
  /* height: auto; */
  /* 문제8-1 프로그레스바의 위치를 swiper아래로 이동*/
  bottom: var(--swiper-control-position-bottom);
  /* 문제8-3 프로그레스바 크기 줄이기 */
  width: calc(100% - 120px);
  /* 문제8-1 기존 top 값을 무력화시키기 위함 */
  top:auto;
  
}
.swiper-pagination-progressbar .swiper-pagination-progressbar-fill{
   background-color: black;
  }
.visual-section .swiper-button{
  /* 문제9-2-2 */
  position: absolute;
  right: 0px; 
  bottom:var(--swiper-control-position-bottom);
  /* 자기 y축 크기의 반만큼 아래로 (x축,y축)*/
  transform: translate(0,50%);
}
.visual-section .swiper-button>div{
  /* 문제9-2-1 */
  /* position:absolute 무력화 */
  position: static;
  /* 수평으로 오면서 너비 높이 지정하고 싶음 */
  display: inline-block;
  width: 24px; height: 24px;
  position: relative;
}
.visual-section .swiper-button .swiper-button-prev,
.visual-section .swiper-button .swiper-button-next{
  /* width: 24px; height: 24px; */
  padding-left: 10px;
  padding-right: 10px;
}
.visual-section .swiper-button .swiper-button-prev::after{
  content:"";
  display: block;
  width: 2px;
  height: 60%;
  background-color: #ccc;
  position: absolute;
  right: 0;
  top:50%;
  transform: translate(0,-50%)


}
.visual-section .swiper-button .swiper-button-prev>img,
.visual-section .swiper-button .swiper-button-next>img{
  width: 100%;
  display: block;
}

.visual-section .swiper-button .swiper-button-prev{}
.visual-section .swiper-button .swiper-button-next>img{
  transform: rotate(180deg);
}
</style>
</head>
<body>
  <!-- Slider main container -->
<div class="section visual-section">
  <div class="swiper swiper1">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
      <!-- Slides -->
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=1" alt="">
        <span>1번슬라이드</span></a></div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=2" alt="">
          <span>2번슬라이드</span></a></div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=3" alt="">
          <span>3번슬라이드</span></a></div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=4" alt=""></a></div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=5" alt=""></a></div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=6" alt=""></a></div>
  
    </div>
    <!-- //swiper-wrapper -->


    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>
  

    <!-- 문제9-1 컨트롤 버튼의 위치를 편리하게 잡기 위해서 wrap-->
    <div class="swiper-button">
      <!-- If we need navigation buttons -->
       <div class="swiper-button-prev">
        <img src="images/arrow_back_ios_48dp.png" alt="이전슬라이드로 이동">
        </div>
       <div class="swiper-button-next">
        <img src="images/arrow_back_ios_48dp.png" alt="다음슬라이드로 이동">
       </div>
       <!-- play 와 pause 버튼이 올거예요 -->
        <div>버튼</div>
    </div>
    <!-- //.swiper-button -->
    </div>
  
    <!-- If we need scrollbar -->
     <!-- pagination을 progressbar로 대체했기때문에 요소제거 -->
    <!-- <div class="swiper-scrollbar"></div> -->

  </div> <!--//swiper -->
</div> <!-- //visual-section -->


<!-- swiper실행 -->
 
<script>
  const swiper1 = new Swiper('.swiper1', {
  // Optional parameters
  direction: 'horizontal',

  //swiper안에 몇개 slide보여줄지 결정
  //3을 위해서 추가
  slidesPerView: 3,

  //5여백
  //swiper에서는 아이템간 여백을 margin-right로 지정. 단위 안씀
  spaceBetween: 20,

  loop: true,
  // 현재슬라이드 중앙에 오도록
  // swiper시작할 때 1번 슬라이드 왼쪽에 마지막 슬라이드 표시
  centeredSlides: true,

  // If we need pagination
  pagination: {
    el: '.swiper-pagination',
    // 7
    // 불릿대신 progressbar
    type: 'progressbar',
    clickable: true,
  },

  // Navigation arrows
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev',
    //아이콘바꿈. 내가 입력한 img태그 이미지 활용
    addIcons:false,
  },

  // And if we need scrollbar
  // progressbar일 때 삭제
  // scrollbar: {
  //   el: '.swiper-scrollbar',
  // },
});
</script>
</body>
</html>
