<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex </title>
  <link rel="stylesheet" href="../reset.css">
  <!-- 
  1. flex 선언 : container
  2. flex 방향결정(축) container
  3. 아이템의 축소, 확장을 결정 item
  4. 아이템의 크기 결정 item
  5. 아이템 줄바꿈을 결정 container
  6. 여백관리 gap: container에 부여(margin을 사용해도 됨: item에 부여)
  7. 정렬 container / item , margin
  -->
  
  <style>
    .wrap{margin: 50px;}
    .container{
      background-color: #fcc;
    }
    .item{
      border: 1px solid #000;
    }
    .flex{
      display: flex;}
    .flex .item{}
  </style>
</head>
<body>
  <div class="wrap">
    <!--.container>.item*4>{item$}-->
    <div class="container flex">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>

  </div>
</body>
</html>
