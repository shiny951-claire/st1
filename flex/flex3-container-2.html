<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex3-container</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- 플렉스 컨테이너 속성 실습을 위해서 
        아이템의 확장x, 축소x -->
  <!-- 
  1. flex 선언 : container
  2. flex 방향결정(축) container
  3. 아이템의 축소, 확장을 결정 item
  4. 아이템의 크기 결정 item
  5. 아이템 줄바꿈을 결정 container
  6. 여백관리 gap: container에 부여(margin을 사용해도 됨: item에 부여)
  7. 정렬 container / item , margin
  -->
  <style>
    .wrap{margin: 50px;}
    .container{
      background-color: #fcc;
      /* box-sizing: border-box; */
    }
    .item{
      border: 1px solid #000;
      
    }
    .flex1{
      width: 300px;
      height: 300px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      column-gap: 1rem;
      row-gap: 10px;
      justify-content: start;
      align-content: start;
      margin-bottom: 50px;

    }
    .flex1 .item{
      flex-grow: 0;/*부모보다 자식이 작을 때 부모크기에 맞춰커짐*/
      flex-shrink: 0;/*부모보다 자식이 클 때 부모크기에 맞춰줄음*/
      width: 80px;
    }

    /* flex 2 */
    .flex2{
      /* 1 */
      display: flex;
      /* 실습을 위해서 */
      width: 300px; 
      height: 150px;/*아이템이 부모의 높이를 따라감*/

      /* 2. 아이템이 진행하는 방향 */
      flex-direction: row;
      flex-direction: column;

      /* 5 아이템의 합이 컨테이너의 크기보다 클 경우
      flex-wrap: wrap;
      아이템에 flex-shrink:0;이 선언되어 있어야 함(줄어들면 안되고 줄변경이 되어야 함)
      */
      flex-wrap: wrap;
      /* 6 */
      /* gap과 justify-content를 함께 지정하면 원하는 레이아웃 안나올 수 있음 */
      /* gap: 1rem; */
      /* 7 */
      /* 주축정렬 */
      justify-content: space-evenly;
      /* 교차축정렬 */
      align-content: space-evenly;
    }
    .flex2 .item{
      /* 3. 축소확장결정 */
      flex-grow: 0;
      flex-shrink: 0;
      /* 4. width bias */
      width: 80px;
      /* 높이를 지정하지 않으면 기본적으로   */
      /* 단처리를 위한% */
      /* width: calc(33.33% - (1rem * (3 - 1)) / 3); */
      height: 60px;
      box-sizing: border-box;
      
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!--.container>.item*4>{item$}-->
    <div class="container flex1">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>
    <div class="container flex2">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>

  </div>
</body>
</html>
