<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex3-container</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- 플렉스 컨테이너 속성 실습을 위해서 
        아이템의 확장x, 축소x -->
  <!-- 
  1. flex 선언 : container
  2. flex 방향결정(축) container
  3. 아이템의 축소, 확장을 결정 item
  4. 아이템의 크기 결정 item
  5. 아이템 줄바꿈을 결정 container
  6. 여백관리 gap: container에 부여(margin을 사용해도 됨: item에 부여)
  7. 정렬 container / item , margin
  -->
  <style>
    .wrap{margin: 50px;}
    .container{
      background-color: #fcc;
    }
    .item{
      border: 1px solid #000;
    }
    .flex{
      width: 300px;
      height: 300px;
      /* 1. flex container 선언; 
      누구한테 줄 것인가? 단이 될 요소의 부모. */
      display: flex;
      
      /* 2. flex 방향결정(축) container 주축과 교차축 결정됨 */
      flex-direction: row;
      
      /* 전제조건: 아이템 확장? 아이템축소x. 넘쳐나야 줄바꿈발생 */
      /*  5. 아이템 줄바꿈을 결정 container: flex-wrap
      플렉스 컨테이너 안에서 flex 아이템의 합이 플렉스 컨테이너보다 클 경우 줄바꿈 
      */
      flex-wrap: wrap;

      /* 6. 여백관리 gap: container에 부여(margin을 사용해도 됨: item에 부여) 
      지정한 gap, justify-content, align-content를 같이 지정하면 원하는 레이아웃을 얻지 못할 수 있음*/
      column-gap: 1rem;
      row-gap: 10px;

      /* 7. 정렬 container / item , margin */
      /* 7-1 주축 정렬 */
      /* justify-content: flex-start; */
      justify-content: start;
      /* 7-2 교차축의 정렬 */
      /* 7-2-1 여러줄의 정렬 align-content*/
      /* 7-2-2 한줄 정렬 align-item */
      /* "플렉스 컨테이너의 교차축 크기에 맞워서 늘어나라"가 기본값*/
      /* align-content: stretch;기본값 */
      align-content: start;

    }
    .flex .item{
      /* 3. 아이템의 축소, 확장을 결정 item */
      /* flex-grow: 0;
      flex-shrink: 1;  여:1, 부:0 기본값*/
      flex-grow: 0;/*부모보다 자식이 작을 때 부모크기에 맞춰커짐*/
      flex-shrink: 0;/*부모보다 자식이 클 때 부모크기에 맞춰줄음*/
      /* 4. 아이템의 크기 결정 item */
      width: 80px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!--.container>.item*4>{item$}-->
    <div class="container flex">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>

  </div>
</body>
</html>
